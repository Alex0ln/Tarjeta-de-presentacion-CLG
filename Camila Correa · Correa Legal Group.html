<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camila Correa · Correa Legal Group</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--d:2s;--ink:#09090a;--gold1:#8c6b25;--gold2:#ecd27e;--gold3:#b9923b;--text:#f3ead2;--muted:#b9a97c;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
--gold:linear-gradient(120deg,var(--gold1),var(--gold2) 45%,var(--gold3) 70%,var(--gold2))}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(90% 60% at 50% 40%,#2a210f 0%,#0d0c0a 70%);color:var(--text);font-family:var(--sans);display:grid;place-items:center;overflow:hidden}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* Intro */
.intro{position:fixed;inset:0;z-index:9;background:var(--ink);display:grid;place-items:center;animation:out .7s ease 1.8s forwards}
.intro svg{width:min(300px,70vw)}
.intro .m{font:600 92px var(--serif);fill:transparent;stroke:url(#ig);stroke-width:1.2;stroke-dasharray:600;stroke-dashoffset:600;animation:trace 1.7s cubic-bezier(.6,.05,.2,1) .15s forwards,fillin .6s ease 1.3s forwards}
.intro .s{font:500 9.5px var(--sans);letter-spacing:.5em;fill:#b9923b;opacity:0;animation:fillin .8s ease 1s forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes fillin{to{opacity:1;fill:#ecd27e}}
.intro .s{--x:1}
@keyframes out{to{opacity:0;visibility:hidden}}
/* Tarjeta */
.scene{perspective:1400px;width:min(360px,calc(100vw - 32px),calc((100dvh - 40px) * .625));aspect-ratio:5/8;cursor:pointer}
.tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;animation:enter 1.5s cubic-bezier(.2,.8,.2,1) var(--d) both}
@keyframes enter{from{opacity:0;transform:translateY(60px) rotateX(35deg) rotateY(-40deg) scale(.85)}to{opacity:1}}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.34,1.25,.5,1)}
.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;container-type:inline-size;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:linear-gradient(160deg,#17130b,#09090a 55%,#120f08);box-shadow:0 30px 70px rgba(0,0,0,.7),0 0 0 1px rgba(185,146,59,.5)}
.face::after{content:"";position:absolute;inset:10px;border:1px solid rgba(185,146,59,.35);border-radius:14px;pointer-events:none}
.face::before{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 42%,rgba(236,210,126,.12) 50%,transparent 58%);transform:translateX(-60%);animation:glint 6s ease-in-out calc(var(--d) + 2s) infinite;pointer-events:none;z-index:2}
@keyframes glint{0%{transform:translateX(-60%)}35%,100%{transform:translateX(60%)}}
.foil{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),rgba(236,210,126,.2),transparent 42%);mix-blend-mode:screen}
.back{transform:rotateY(180deg)}
.content{position:absolute;inset:0;padding:9cqw 8cqw 7cqw;display:flex;flex-direction:column;align-items:center;text-align:center}
.gold-text{background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.mono{font-family:var(--serif);font-weight:600;letter-spacing:.2em;font-size:5cqw;padding-left:.2em}
.stage{position:relative;width:78cqw;aspect-ratio:1;margin-top:4cqw}
.l{position:absolute;inset:0;transition:transform .2s ease-out}
.l1{transform:translate(calc(var(--px,0)*-9px),calc(var(--py,0)*-9px))}
.l2{transform:translate(calc(var(--px,0)*7px),calc(var(--py,0)*7px))}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:url(#g);stroke-linecap:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.6,.05,.2,1) calc(var(--d) + .5s) forwards}
.r3.draw{animation-delay:calc(var(--d) + .8s)}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{transform-origin:150px 150px;animation:spin 46s linear infinite}
.spin.rev{animation-duration:60s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ring-text{font:500 8.6px var(--sans);fill:#d8bb64;opacity:0;animation:fillin2 1.4s ease calc(var(--d) + 1.8s) forwards}
@keyframes fillin2{to{opacity:.95}}
.photo{position:absolute;left:21%;top:21%;width:58%;height:58%;border-radius:50%;object-fit:cover;object-position:50% 20%;opacity:0;transform:scale(.8);filter:blur(8px);box-shadow:0 0 0 2px var(--ink),0 0 0 3px var(--gold3),0 14px 40px rgba(0,0,0,.6);animation:reveal 1.6s cubic-bezier(.2,.7,.2,1) calc(var(--d) + 1.2s) forwards}
@keyframes reveal{to{opacity:1;transform:scale(1);filter:none}}
h1{font-family:var(--serif);font-weight:500;font-size:10.5cqw;line-height:1.05;margin-top:5cqw;white-space:nowrap}
h1 span{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.45em);background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ch .8s cubic-bezier(.2,.7,.2,1) calc(var(--d) + 2.2s + var(--i)*.05s) forwards,sheen 7s ease-in-out infinite}
h1 .sp{width:.28em}
@keyframes ch{to{opacity:1;filter:none;transform:none}}
.role{font-size:2.9cqw;letter-spacing:.3em;padding-left:.3em;color:var(--muted);margin-top:2.4cqw;opacity:0;animation:fillin2 1s ease calc(var(--d) + 3s) forwards}
.badge{position:relative;width:34cqw;aspect-ratio:1;margin-top:2cqw;display:grid;place-items:center}
.badge svg{position:absolute;inset:0;width:100%;height:100%}
.badge b{font:600 11cqw var(--serif);letter-spacing:.04em;padding-left:.04em}
.firm{font-family:var(--serif);font-weight:600;font-size:11.5cqw;letter-spacing:.14em;padding-left:.14em;line-height:1;margin-top:4cqw}
.rule{width:100%;height:1px;margin:4cqw 0 3cqw;background:var(--gold)}
.legal{font-size:2.9cqw;letter-spacing:.4em;padding-left:.4em;color:var(--gold3);font-weight:500}
.tag{font-family:var(--serif);font-style:italic;font-size:5.2cqw;color:var(--muted);margin-top:3.5cqw;line-height:1.3}
.actions{width:100%;display:grid;gap:2.6cqw;margin-top:auto}
.flipped .back .stg{animation:in .8s cubic-bezier(.2,.8,.2,1) calc(.55s + var(--i)*.1s) both}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.flipped .back .rule{transform-origin:left;animation:ln 1s cubic-bezier(.6,.05,.2,1) .6s both}
@keyframes ln{from{transform:scaleX(0)}to{transform:none}}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:2.4cqw;padding:3.3cqw 4cqw;border-radius:999px;font:500 3.5cqw var(--sans);letter-spacing:.04em;text-decoration:none;color:var(--text);border:1px solid var(--gold3);background:transparent;cursor:pointer;transition:transform .25s,color .25s,box-shadow .25s}
.btn::before{content:"";position:absolute;inset:0;background:var(--gold);transform:translateX(-101%);transition:transform .45s cubic-bezier(.6,.05,.2,1)}
.btn>*{position:relative}
.btn:hover,.btn:focus-visible{color:#1a1405;transform:translateY(-2px);box-shadow:0 8px 24px rgba(185,146,59,.3);outline:none}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.btn svg{width:4.4cqw;height:4.4cqw;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.flip{margin-top:auto;background:none;border:0;color:var(--muted);font:500 3cqw var(--sans);letter-spacing:.2em;padding:2cqw 3cqw;cursor:pointer;display:flex;align-items:center;gap:2cqw;transition:color .25s;opacity:0;animation:fillin2 1s ease calc(var(--d) + 3.3s) forwards}
.flip:hover,.flip:focus-visible{color:var(--gold2);outline:none}
.flip:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:6px}
.flip svg{width:4.2cqw;height:4.2cqw;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:nudge 3s ease-in-out infinite}
@keyframes nudge{50%{transform:rotate(180deg)}}
.back .flip{margin:3cqw 0 0;animation:none;opacity:1}
@media (prefers-reduced-motion:reduce){.intro,#dust{display:none}:root{--d:0s}*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
(function(){
 var scene=document.getElementById('scene'),tilt=document.getElementById('tilt'),front=document.getElementById('front'),back=document.getElementById('back'),on=false;
 // nombre letra a letra
 var n=document.getElementById('name'),txt=n.textContent;n.textContent='';
 txt.split('').forEach(function(c,i){var s=document.createElement('span');s.className=(c===' '?'sp':'');s.style.setProperty('--i',i);s.setAttribute('aria-hidden','true');s.textContent=c===' '?'\u00a0':c;n.appendChild(s)});
 function flip(){on=!on;scene.classList.toggle('flipped',on);
  if(on){front.setAttribute('inert','');back.removeAttribute('inert')}else{back.setAttribute('inert','');front.removeAttribute('inert')}}
 document.querySelectorAll('[data-flip]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();flip()})});
 scene.addEventListener('click',function(e){if(!e.target.closest('a,button'))flip()});
 var rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(!rm&&matchMedia('(hover:hover)').matches){
  document.addEventListener('pointermove',function(e){
   var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5,r=scene.getBoundingClientRect();
   tilt.style.setProperty('--ry',(x*16)+'deg');tilt.style.setProperty('--rx',(-y*12)+'deg');
   document.documentElement.style.setProperty('--px',x*2);document.documentElement.style.setProperty('--py',y*2);
   var mx=((e.clientX-r.left)/r.width*100)+'%',my=((e.clientY-r.top)/r.height*100)+'%';
   scene.querySelectorAll('.foil').forEach(function(f){f.style.setProperty('--mx',mx);f.style.setProperty('--my',my)});
  });
 }
 // polvo dorado
 var cv=document.getElementById('dust'),cx=cv.getContext('2d'),P=[],W,H;
 function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
 for(var i=0;i<55;i++)P.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.6,v:.00008+Math.random()*.00022,p:Math.random()*6.3,s:.5+Math.random()*1.5});
 (function loop(t){if(rm)return;cx.clearRect(0,0,W,H);
  P.forEach(function(q){q.y-=q.v;if(q.y<-.02){q.y=1.02;q.x=Math.random()}
   var a=.15+.5*Math.abs(Math.sin(t/1000*q.s+q.p));
   cx.beginPath();cx.arc(q.x*W+Math.sin(t/3000+q.p)*10,q.y*H,q.r,0,6.283);cx.fillStyle='rgba(236,210,126,'+a+')';cx.fill()});
  requestAnimationFrame(loop)})(0);
})();
</script>
